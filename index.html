<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>EventPass — Sign In</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64' fill='none'%3E%3Crect x='4' y='4' width='56' height='56' rx='16' fill='%23070d1c'/%3E%3Ccircle cx='32' cy='32' r='10' fill='%2338bdf8'/%3E%3Cellipse cx='32' cy='32' rx='21' ry='8.5' transform='rotate(-26 32 32)' stroke='%237dd3fc' stroke-width='2.4'/%3E%3Ccircle cx='48' cy='24' r='3' fill='%23ffffff'/%3E%3C/svg%3E" />
  <style>
    :root {
      --bg: #070b16;
      --text: #f8fafc;
      --muted: rgba(248, 250, 252, 0.68);
      --accent: #38bdf8;
      --accent-2: #2563eb;
      --glass: rgba(255, 255, 255, 0.08);
      --border: rgba(255, 255, 255, 0.2);
      --danger: #fb7185;
    }
    body.lagoon {
      --bg: #05131c;
      --accent: #22d3ee;
      --accent-2: #0284c7;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0;
      min-height: 100dvh;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: max(18px, env(safe-area-inset-top)) 16px max(20px, env(safe-area-inset-bottom));
      gap: 18px;
      overflow-x: hidden;
    }
    .aurora {
      position: fixed;
      inset: -15%;
      pointer-events: none;
      filter: blur(85px);
      opacity: 0.72;
      z-index: 0;
    }
    .aurora span { position: absolute; border-radius: 50%; }
    .aurora span:nth-child(1) { width: 380px; height: 380px; top: 6%; left: 10%; background: rgba(37, 99, 235, 0.55); }
    .aurora span:nth-child(2) { width: 340px; height: 340px; bottom: 8%; right: 10%; background: rgba(56, 189, 248, 0.45); }
    .aurora span:nth-child(3) { width: 260px; height: 260px; top: 45%; left: 45%; background: rgba(99, 102, 241, 0.35); }

    .shell {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 14px;
      border-radius: 18px;
      background: var(--glass);
      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);
      border: 1px solid var(--border);
    }
    .brand {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      font-weight: 700;
      font-size: 15px;
      color: var(--accent);
    }
    .theme-btn {
      min-height: 34px;
      padding: 6px 12px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.08);
      color: var(--text);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }

    .panel {
      width: 100%;
      padding: 26px 22px;
      border-radius: 26px;
      background: var(--glass);
      backdrop-filter: blur(28px) saturate(175%);
      -webkit-backdrop-filter: blur(28px) saturate(175%);
      border: 1px solid var(--border);
      box-shadow: 0 28px 65px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.22);
      display: flex;
      flex-direction: column;
      gap: 18px;
    }
    .head h1 { margin: 0 0 4px; font-size: 24px; letter-spacing: -0.02em; }
    .head p { margin: 0; font-size: 13.5px; color: var(--muted); }

    .role-tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      padding: 4px;
      border-radius: 14px;
      background: rgba(7, 11, 22, 0.45);
      border: 1px solid rgba(255, 255, 255, 0.14);
    }
    .role-btn {
      min-height: 40px;
      border: 1px solid transparent;
      border-radius: 10px;
      background: transparent;
      color: var(--muted);
      font-size: 13.5px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.18s ease;
    }
    .role-btn.is-active {
      background: linear-gradient(135deg, rgba(56, 189, 248, 0.25), rgba(37, 99, 235, 0.32));
      border-color: rgba(125, 211, 252, 0.45);
      color: #fff;
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .field {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .field.is-hidden { display: none; }
    label {
      font-size: 12.5px;
      font-weight: 600;
      color: rgba(248, 250, 252, 0.85);
    }
    .input-wrap {
      position: relative;
      display: flex;
      align-items: center;
    }
    input {
      width: 100%;
      min-height: 46px;
      padding: 10px 14px;
      border-radius: 14px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      background: rgba(7, 11, 22, 0.52);
      color: #fff;
      font-size: 16px;
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }
    input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2);
    }
    .toggle-pw {
      position: absolute;
      right: 8px;
      min-height: 32px;
      padding: 4px 10px;
      border-radius: 9px;
      border: 1px solid rgba(255, 255, 255, 0.16);
      background: rgba(255, 255, 255, 0.08);
      color: var(--muted);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }

    .error-msg {
      display: none;
      padding: 10px 12px;
      border-radius: 12px;
      background: rgba(251, 113, 133, 0.14);
      border: 1px solid rgba(251, 113, 133, 0.45);
      color: #fecdd3;
      font-size: 13px;
      font-weight: 600;
    }
    .error-msg.is-show { display: block; }

    .submit-btn {
      width: 100%;
      min-height: 48px;
      margin-top: 4px;
      border-radius: 15px;
      border: 1px solid rgba(255, 255, 255, 0.3);
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: #fff;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 12px 28px rgba(37, 99, 235, 0.42);
      transition: transform 0.15s ease, filter 0.2s ease;
    }
    .submit-btn:hover { filter: brightness(1.06); }
    .submit-btn:active { transform: scale(0.97); }
    .submit-btn:disabled { opacity: 0.7; cursor: wait; }

    .mode-switch {
      text-align: center;
      font-size: 13px;
      color: var(--muted);
    }
    .mode-switch button {
      background: none;
      border: none;
      color: var(--accent);
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
      padding: 0 4px;
    }

    footer {
      padding: 12px 14px;
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.12);
      text-align: center;
      font-size: 11px;
      color: var(--muted);
      line-height: 1.5;
    }
    footer strong { color: var(--text); }
  </style>
</head>
<body>
  <div class="aurora" aria-hidden="true"><span></span><span></span><span></span></div>

  <div class="shell">
    <div class="top-bar">
      <div class="brand">
        <svg width="26" height="26" viewBox="0 0 64 64" fill="none" style="border-radius:8px">
          <defs><linearGradient id="g1" x1="10" y1="10" x2="54" y2="54" gradientUnits="userSpaceOnUse"><stop offset="0%" stop-color="#22d3ee"/><stop offset="100%" stop-color="#2563eb"/></linearGradient></defs>
          <rect x="4" y="4" width="56" height="56" rx="16" fill="#070d1c" stroke="#ffffff" stroke-opacity="0.18" stroke-width="1.5"/>
          <circle cx="32" cy="32" r="10" fill="url(#g1)"/>
          <ellipse cx="32" cy="32" rx="21" ry="8.5" transform="rotate(-26 32 32)" stroke="#7dd3fc" stroke-width="2.4"/>
          <circle cx="48" cy="24" r="3" fill="#ffffff"/>
        </svg>
        EventPass
      </div>
      <button id="themeBtn" type="button" class="theme-btn">Theme: Dusk</button>
    </div>

    <main class="panel">
      <div class="head">
        <h1 id="authTitle">Sign in</h1>
        <p id="authSubtitle">Access your EventPass events and dashboard.</p>
      </div>

      <form id="loginForm" novalidate>
        <div id="nameGroup" class="field is-hidden">
          <label for="nameInput">Full Name</label>
          <input id="nameInput" type="text" placeholder="Ananya Kulkarni" autocomplete="name" />
        </div>

        <div class="field">
          <label for="emailInput">Email</label>
          <input id="emailInput" type="email" placeholder="you@eventpass.edu" autocomplete="email" required />
        </div>

        <div class="field">
          <label for="passwordInput">Password</label>
          <div class="input-wrap">
            <input id="passwordInput" type="password" placeholder="Enter password" autocomplete="current-password" style="padding-right:70px;" required />
            <button id="togglePwBtn" type="button" class="toggle-pw">Show</button>
          </div>
        </div>

        <div id="formError" class="error-msg" role="alert"></div>

        <button id="signInBtn" type="submit" class="submit-btn">Sign In</button>
      </form>

      <div class="mode-switch">
        <span id="modePrompt">Don't have an account?</span>
        <button id="toggleModeBtn" type="button">Create account</button>
      </div>
    </main>

    <footer>
      <div>© 2026 <strong>EventPass</strong> — <strong>Polaris School of Technology</strong> OJT Project.</div>
    </footer>
  </div>

  <script>
    let isSignUp = false;

    const nameGroup = document.getElementById("nameGroup");
    const nameInput = document.getElementById("nameInput");
    const emailInput = document.getElementById("emailInput");
    const passwordInput = document.getElementById("passwordInput");
    const formError = document.getElementById("formError");
    const signInBtn = document.getElementById("signInBtn");
    const authTitle = document.getElementById("authTitle");
    const authSubtitle = document.getElementById("authSubtitle");
    const modePrompt = document.getElementById("modePrompt");
    const toggleModeBtn = document.getElementById("toggleModeBtn");
    const themeBtn = document.getElementById("themeBtn");

    // Redirect if already authenticated
    (async function checkExistingSession() {
      const existingToken = localStorage.getItem("eventpass_token");
      if (!existingToken) return;
      try {
        const res = await fetch("/api/auth/me", {
          headers: { Authorization: `Bearer ${existingToken}` }
        });
        if (res.ok) {
          const data = await res.json();
          if (data.success && data.user) {
            localStorage.setItem("eventpass_user", JSON.stringify(data.user));
            window.location.href = "home.html";
          }
        } else {
          localStorage.removeItem("eventpass_token");
          localStorage.removeItem("eventpass_user");
        }
      } catch (e) {}
    })();

    // Restore theme
    if (localStorage.getItem("eventpass_liquid_theme") === "lagoon") {
      document.body.classList.add("lagoon");
      themeBtn.textContent = "Theme: Lagoon";
    }

    function showError(msg) {
      formError.textContent = msg;
      formError.classList.add("is-show");
    }
    function clearError() {
      formError.textContent = "";
      formError.classList.remove("is-show");
    }

    toggleModeBtn.addEventListener("click", () => {
      isSignUp = !isSignUp;
      clearError();
      nameGroup.classList.toggle("is-hidden", !isSignUp);
      authTitle.textContent = isSignUp ? "Create account" : "Sign in";
      authSubtitle.textContent = isSignUp
        ? "Create your EventPass account in seconds."
        : "Access your EventPass events and dashboard.";
      signInBtn.textContent = isSignUp ? "Create Account" : "Sign In";
      modePrompt.textContent = isSignUp ? "Already have an account?" : "Don't have an account?";
      toggleModeBtn.textContent = isSignUp ? "Sign in" : "Create account";
    });

    document.getElementById("togglePwBtn").addEventListener("click", (e) => {
      const showing = passwordInput.type === "text";
      passwordInput.type = showing ? "password" : "text";
      e.target.textContent = showing ? "Show" : "Hide";
    });

    themeBtn.addEventListener("click", (e) => {
      const isLagoon = document.body.classList.toggle("lagoon");
      e.target.textContent = isLagoon ? "Theme: Lagoon" : "Theme: Dusk";
      localStorage.setItem("eventpass_liquid_theme", isLagoon ? "lagoon" : "dusk");
    });

    document.getElementById("loginForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      clearError();

      const fullName = nameInput.value.trim();
      const email = emailInput.value.trim();
      const password = passwordInput.value;

      if (isSignUp && fullName.length < 2) {
        showError("Please enter your full name.");
        nameInput.focus();
        return;
      }
      if (!email || !email.includes("@")) {
        showError("Please enter a valid email address.");
        emailInput.focus();
        return;
      }
      if (!password || (isSignUp && password.length < 6)) {
        showError(isSignUp ? "Password must be at least 6 characters." : "Please enter your password.");
        passwordInput.focus();
        return;
      }

      signInBtn.disabled = true;
      signInBtn.textContent = isSignUp ? "Creating Account..." : "Signing In...";

      try {
        const endpoint = isSignUp ? "/api/auth/register" : "/api/auth/login";
        const body = isSignUp
          ? { fullName, email, password }
          : { email, password };

        const res = await fetch(endpoint, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body)
        });
        const data = await res.json();

        if (!res.ok || !data.success) {
          showError(data.error || "Authentication failed.");
          signInBtn.disabled = false;
          signInBtn.textContent = isSignUp ? "Create Account" : "Sign In";
          return;
        }

        localStorage.setItem("eventpass_token", data.token);
        localStorage.setItem("eventpass_user", JSON.stringify(data.user));
        window.location.href = "home.html";
      } catch (err) {
        showError("Could not reach server. Make sure the backend is running.");
        signInBtn.disabled = false;
        signInBtn.textContent = isSignUp ? "Create Account" : "Sign In";
      }
    });
  </script>
</body>
</html>
